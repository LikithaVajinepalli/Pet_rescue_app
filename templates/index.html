<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pet Rescue and Adoption</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #fdf6f0; }
        h1 { color: #5d4037; }
        .card { background: #fff; padding: 20px; border-radius: 8px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.1); max-width: 600px; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat { background: #ff8f00; color: #fff; padding: 15px 25px;
                border-radius: 6px; text-align: center; }
        .stat.green { background: #27ae60; }
        .stat.red { background: #e74c3c; }
        a.btn { display: inline-block; margin-top: 10px; padding: 10px 18px;
                background: #5d4037; color: #fff; text-decoration: none;
                border-radius: 5px; margin-right: 10px; }
        a.btn:hover { background: #3e2723; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐾 Pet Rescue and Adoption</h1>
        <p>Welcome to the Pet Rescue Dashboard</p>

        <div class="stats">
            <div class="stat">Total: {{ total }}</div>
            <div class="stat green">Available: {{ available }}</div>
            <div class="stat red">Adopted: {{ adopted }}</div>
        </div>

        <a href="/add" class="btn">➕ Add Pet</a>
        <a href="/pets" class="btn">🐶 View Pets</a>
    </div>
</body>
</html>

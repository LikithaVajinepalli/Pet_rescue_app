<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Pet</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #fdf6f0; }
        .card { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; padding: 8px; margin: 8px 0 16px; box-sizing: border-box; }
        button { padding: 10px 18px; background: #5d4037; color: #fff; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Add New Pet</h2>
        <form method="POST">
            <label>Pet Name</label>
            <input type="text" name="name" placeholder="Enter pet name" required>
            <label>Pet Type</label>
            <input type="text" name="type" placeholder="Dog, Cat, Rabbit..." required>
            <button type="submit">Add Pet</button>
        </form>
        <p><a href="/">⬅ Back to Home</a></p>
    </div>
</body>
</html>
